name: ai-company-m1
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: company
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local}
      POSTGRES_DB: company
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.6-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  redis-data:
